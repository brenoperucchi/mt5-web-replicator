# Scenario catalog, design 0001 section 8. Expected outcome is reviewed, never regenerated by CI.
id: S25
title: "Rotate response lost"
area: both
expected: "old token still works; replay → 409 `rotation_pending`; no token in DB/logs"
steps:
  - "POST /v4/token/rotate is applied but the reply is lost; old token keeps working"
  - "replay -> 409 rotation_pending; no pending token on disk -> rotate?restart=true"
  - "new token written atomically to the token file, then POST /v4/token/confirm with the new token"
  - "old token revoked; no token stored in DB, raw or logs"
covered_by:
  server:
    - server/tests/test_rotation.py
    - server/tests/test_secrets.py
  ea:
    - ea/mt5/Experts/TradeMirrorSelfTest.mq5
  ea_how: "self-test S25; live: fault_proxy --drop-rotate 1"
  contract: [server/tests/test_ea_contract.py]
