# Scenario catalog, design 0001 section 8. Expected outcome is reviewed, never regenerated by CI.
id: S01
title: "Lost result after `OrderSend`; open re-delivered"
area: both
expected: "EA journal `confirmed` → result re-sent; one position; copy `open`"
steps:
  - "slave polls: open c<copy_id> delivered"
  - "EA: journal prepared -> sent (in_progress posted) -> OrderSend -> confirmed done"
  - "POST /v4/slave/results is applied by the server but the reply is lost"
  - "EA keeps the result in the outbox and re-posts the same batch (same Idempotency-Key)"
  - "lease expires: the open is re-delivered"
  - "EA finds the attempt confirmed in the journal and re-sends the stored result; no OrderSend"
covered_by:
  server:
    - server/tests/test_results.py
  ea:
    - ea/mt5/Experts/TradeMirrorSelfTest.mq5
  ea_how: "self-test S01; live: fault_proxy --drop-results 1"
  contract: [server/tests/test_ea_contract.py]
