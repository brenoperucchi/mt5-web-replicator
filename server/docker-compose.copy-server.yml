# TradeMirror Copy Server: FastAPI + Postgres 16. Independent of the Rails app's docker-compose.yml.
#
#   cp .env.example .env     # fill ADMIN_TOKEN and TOKEN_PEPPER (openssl rand -hex 32)
#   docker compose -f docker-compose.copy-server.yml up -d --build
#
# SQLite variant (single container, no Postgres):
#   docker compose -f docker-compose.copy-server.yml --profile sqlite up -d --build copy-server-sqlite
name: copy-server

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: copycore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: copycore
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copycore -d copycore"]
      interval: 5s
      timeout: 3s
      retries: 20

  copy-server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}
      DATABASE_URL: postgresql://${PG_USER:-copycore}:${POSTGRES_PASSWORD}@db:5432/${PG_DB:-copycore}
    ports:
      - "${COPY_SERVER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Optional: SQLite (WAL) in a named volume, one worker. Fine for a trial or a few accounts.
  copy-server-sqlite:
    profiles: ["sqlite"]
    build: .
    restart: unless-stopped
    environment:
      ENV: production
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      TOKEN_PEPPER: ${TOKEN_PEPPER:?set TOKEN_PEPPER in .env}
      DATABASE_URL: sqlite:////data/copy.db
    volumes:
      - sqlite-data:/data
    ports:
      - "${COPY_SERVER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pg-data:
  sqlite-data:
