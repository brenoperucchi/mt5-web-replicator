name: Docker publish

# Builds the production image and pushes it to GHCR:
#   ghcr.io/brenoperucchi/mt5-web-replicator:latest and :sha-<short sha>  (master, after CI passes)
#   ghcr.io/brenoperucchi/mt5-web-replicator:1.2.3, :1.2 and :1           (tags v1.2.3)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brenoperucchi/mt5-web-replicator

jobs:
  publish:
    # On master, only publish commits whose CI run succeeded (and were pushes, not PRs).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run runs on the default branch; build exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # workflow_run events carry the default branch's latest sha in github.sha;
      # tag the image with the commit CI actually tested.
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'push' }}
            type=raw,value=sha-${{ steps.sha.outputs.short }},enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.source=https://github.com/brenoperucchi/mt5-web-replicator
            org.opencontainers.image.description=MT5 Web Replicator: Rails backend that receives and replicates MetaTrader 5 trades across accounts
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
