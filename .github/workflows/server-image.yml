name: Server image publish

# Builds the Copy Server image (server/Dockerfile) and pushes it to GHCR:
#   ghcr.io/brenoperucchi/mt5-web-replicator-server:1.2.3 and :1.2   (tags server-v1.2.3)
#   ghcr.io/brenoperucchi/mt5-web-replicator-server:sha-<short sha>  (every run)
#   ghcr.io/brenoperucchi/mt5-web-replicator-server:manual           (workflow_dispatch only)
# Runs ONLY on server-v* tags and manual dispatch. Never on pull requests or pushes to master.
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/brenoperucchi/mt5-web-replicator-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=server-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=server-v(\d+\.\d+)\.\d+,group=1
            type=sha,prefix=sha-,format=short
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/brenoperucchi/mt5-web-replicator
            org.opencontainers.image.description=TradeMirror Copy Server: standalone FastAPI server for MT5 trade copying
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
